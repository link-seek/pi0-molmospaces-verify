# pi0 serve 配置（MolmoSpaces/Franka 口径, 自包含, 不用 extends）
# 上游 LIBERO 版只改了 image_keys: LIBERO 相机名(agentview/wrist) -> Molmo 相机名(exo_camera_1/wrist_camera)
# script 相对路径, 运行方 CWD 必须是 harness 根目录 (ci_smoke.sh 里 -w /work/harness)。
script: "src/vla_eval/model_servers/lerobot.py"
args:
  policy_type: pi05
  checkpoint: lerobot/pi05_libero_finetuned
  device: cuda
  port: 8000
  state_key: observation.state
  chunk_size: 10
  image_keys:
    exo_camera_1: image
    wrist_camera: image2
